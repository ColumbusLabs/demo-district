{
  "name": "World and navigation checks (free runners only)",
  "on": {
    "push": { "branches": ["build/demo-district-v1"] },
    "pull_request": { "branches": ["main"] }
  },
  "permissions": { "contents": "read" },
  "concurrency": { "group": "scaffold-${{ github.ref }}", "cancel-in-progress": true },
  "jobs": {
    "verify": {
      "if": "${{ github.event.repository.visibility == 'public' && github.event.repository.private == false }}",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "steps": [
        { "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", "with": { "persist-credentials": false } },
        { "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020", "with": { "node-version-file": ".nvmrc", "package-manager-cache": false } },
        { "name": "Reject paid-runner or storage configuration", "run": "node scripts/check-ci-policy.mjs" },
        { "name": "Clean locked install", "run": "npm ci" },
        { "name": "Repository, runtime, movement, typecheck, build, and artifact checks", "run": "npm run verify" },
        { "name": "Install test browser", "run": "npx --no-install playwright install --with-deps chromium" },
        { "name": "Production browser checks", "run": "npm run test:browser" },
        { "name": "Lifecycle, navigation, and actual HMR checks", "run": "npm run test:lifecycle" },
        { "name": "Runtime dependency audit", "run": "npm audit --omit=dev --audit-level=high" },
        { "name": "Verify checks did not modify tracked files", "run": "git diff --exit-code" },
        { "name": "Record test counts in logs and job summary only", "if": "always()", "run": "node scripts/summarize-checks.mjs" }
      ]
    }
  }
}
