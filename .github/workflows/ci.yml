name: Scaffold checks
on:
  push:
    branches: [build/demo-district-v1]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: scaffold-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Clean locked install
        run: npm ci
      - name: Repository, typecheck, build, and static artifact checks
        run: npm run verify
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Production-browser smoke tests
        run: npm run test:browser
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Verify checks did not modify tracked files
        run: git diff --exit-code
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scaffold-evidence
          path: test-results/
          retention-days: 7
