name: Scaffold checks
on:
  push:
    branches: [build/demo-district-v1]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: scaffold-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Temporary bootstrap permission; removed when the generated lockfile is committed.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Detect first-install bootstrap
        id: bootstrap
        run: |
          if [ ! -f package-lock.json ]; then echo 'needed=true' >> "$GITHUB_OUTPUT"; fi
      - name: Generate genuine lockfile and pin resolved direct dependencies
        if: steps.bootstrap.outputs.needed == 'true'
        run: |
          npm install --ignore-scripts
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          for (const group of ['dependencies', 'devDependencies']) {
            for (const name of Object.keys(pkg[group] ?? {})) {
              pkg[group][name] = JSON.parse(fs.readFileSync(`node_modules/${name}/package.json`, 'utf8')).version;
            }
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          JS
          npm install --package-lock-only --ignore-scripts
      - name: Clean locked install
        run: npm ci
      - name: Repository, typecheck, build, and static artifact checks
        run: npm run verify
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Production-browser smoke tests
        run: npm run test:browser
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Record verified bootstrap checkpoint on the implementation branch only
        if: steps.bootstrap.outputs.needed == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/build/demo-district-v1'
        run: |
          node scripts/record-slice-01.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json README.md docs/IMPLEMENTATION_PLAN.md docs/SLICE_01.md
          git diff --cached --quiet || git commit -m 'slice-01: lock tested dependencies and record scaffold evidence'
          git push origin HEAD:refs/heads/build/demo-district-v1
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scaffold-evidence
          path: test-results/
          retention-days: 7
